<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports — DRIVE.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="appLayout" class="app-layout"></div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script>
        if (!requireAuth()) throw new Error("Not authenticated");
        if (!requireRole("staff", "admin")) throw new Error("Not authorized");
        buildLayout("reports");
        document.getElementById("pageTitle").textContent = "Reports";

        const content = document.getElementById("pageContent");
        let activeTab = "utilization";

        content.innerHTML = `
            <ul class="nav nav-tabs mb-4">
                <li class="nav-item">
                    <a class="nav-link ${activeTab === 'utilization' ? 'active' : ''}" href="#" onclick="switchTab('utilization')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                        Fleet Utilization
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link ${activeTab === 'revenue' ? 'active' : ''}" href="#" onclick="switchTab('revenue')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                        Revenue Report
                    </a>
                </li>
            </ul>
            <div id="reportContent"></div>
            <div id="alertBox"></div>`;

        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll(".nav-link").forEach(l => l.classList.remove("active"));
            event.target.closest(".nav-link").classList.add("active");
            loadReport();
        }

        async function loadReport() {
            const reportDiv = document.getElementById("reportContent");
            reportDiv.innerHTML = skeletonTable();

            try {
                if (activeTab === "utilization") {
                    const res = await apiFetch("/admin/reports/utilization");
                    const data = res.data || [];

                    if (data.length === 0) {
                        reportDiv.innerHTML = `<div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--c-text-dim)" stroke-width="1.5"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><h5>No Data Yet</h5><p>Complete some bookings to see utilization reports.</p></div>`;
                        return;
                    }

                    reportDiv.innerHTML = data.map(branch => `
                        <div class="data-table mb-4">
                            <div class="table-header">
                                <h5><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg> ${branch.branchName}</h5>
                                <div>
                                    <span class="badge-status" style="background:var(--c-accent-dim);color:var(--c-accent);margin-right:8px">${branch.branchBookings} bookings</span>
                                    <span class="badge-status" style="background:rgba(0,196,140,0.15);color:var(--c-success)">${formatCurrency(branch.branchRevenue)} revenue</span>
                                </div>
                            </div>
                            <table class="table table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th>Vehicle</th>
                                        <th>Total Bookings</th>
                                        <th>Total Days</th>
                                        <th>Revenue</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${branch.vehicles.map(v => `
                                        <tr>
                                            <td><strong>${v.brand} ${v.model}</strong></td>
                                            <td>${v.totalBookings}</td>
                                            <td>${v.totalDays}</td>
                                            <td><strong>${formatCurrency(v.totalRevenue)}</strong></td>
                                        </tr>
                                    `).join("")}
                                </tbody>
                            </table>
                        </div>
                    `).join("");
                } else {
                    const res = await apiFetch("/admin/reports/revenue");
                    const data = res.data || [];

                    if (data.length === 0) {
                        reportDiv.innerHTML = `<div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--c-text-dim)" stroke-width="1.5"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><h5>No Revenue Data</h5><p>Complete some bookings to see revenue reports.</p></div>`;
                        return;
                    }

                    reportDiv.innerHTML = `
                        <div class="data-table">
                            <div class="table-header">
                                <h5>Revenue by Date</h5>
                                <div>Total: <strong>${formatCurrency(data.reduce((s, d) => s + d.totalRevenue, 0))}</strong></div>
                            </div>
                            <table class="table table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Bookings</th>
                                        <th>Rental Days</th>
                                        <th>Revenue</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.map(d => `
                                        <tr>
                                            <td>${d._id}</td>
                                            <td>${d.totalBookings}</td>
                                            <td>${d.totalDays}</td>
                                            <td><strong>${formatCurrency(d.totalRevenue)}</strong></td>
                                        </tr>
                                    `).join("")}
                                </tbody>
                            </table>
                        </div>`;
                }
            } catch (err) {
                reportDiv.innerHTML = `<div class="alert" style="background:rgba(255,68,68,0.12);color:#ff4444;padding:16px;border-radius:12px">Failed to load report</div>`;
            }
        }

        loadReport();
    </script>
</body>
</html>
