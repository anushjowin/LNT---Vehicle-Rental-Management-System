<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — DRIVE.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="appLayout" class="app-layout"></div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script>
        if (!requireAuth()) throw new Error("Not authenticated");
        buildLayout("dashboard");
        document.getElementById("pageTitle").textContent = "Dashboard";

        const user = getUser();
        const content = document.getElementById("pageContent");

        async function loadDashboard() {
            let stats = {};

            try {
                if (user.role === "customer") {
                    const bookings = await apiFetch(`/bookings/customer/${user._id}`);
                    const allBookings = bookings.data || [];
                    stats.totalBookings = allBookings.length;
                    stats.activeBookings = allBookings.filter(b => b.status === "reserved" || b.status === "picked_up").length;
                    stats.totalSpent = allBookings.reduce((sum, b) => sum + (b.totalAmount || 0), 0);
                } else {
                    const vehicles = await apiFetch("/vehicles");
                    const allVehicles = vehicles.data || [];
                    stats.totalVehicles = allVehicles.length;
                    stats.availableVehicles = allVehicles.filter(v => v.status === "available").length;
                    stats.bookedVehicles = allVehicles.filter(v => v.status === "booked").length;
                    stats.maintenanceVehicles = allVehicles.filter(v => v.status === "maintenance").length;

                    const branches = await apiFetch("/branches");
                    stats.totalBranches = (branches.data || []).length;
                }
            } catch (err) {
                console.error(err);
            }

            if (user.role === "customer") {
                content.innerHTML = `
                    <div class="mb-4">
                        <h4 class="heading-lg">Welcome, ${user.name}</h4>
                        <p class="text-muted">Here's your rental activity overview</p>
                    </div>
                    <div class="grid-3 mb-4">
                        <div class="stat-card">
                            <div class="stat-icon blue"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
                            <div class="stat-value" data-target="${stats.totalBookings || 0}">${stats.totalBookings || 0}</div>
                            <div class="stat-label">Total Bookings</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon green"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
                            <div class="stat-value" data-target="${stats.activeBookings || 0}">${stats.activeBookings || 0}</div>
                            <div class="stat-label">Active Bookings</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon purple"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
                            <div class="stat-value" data-target="${stats.totalSpent || 0}">${formatCurrency(stats.totalSpent || 0)}</div>
                            <div class="stat-label">Total Spent</div>
                        </div>
                    </div>
                    <div class="grid-2">
                        <div class="stat-card text-center" style="cursor:pointer" onclick="location.href='vehicles.html'">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--c-accent)" stroke-width="2" style="margin-bottom:12px"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <h5>Search Vehicles</h5>
                            <p class="text-muted mb-0">Find available cars & bikes</p>
                        </div>
                        <div class="stat-card text-center" style="cursor:pointer" onclick="location.href='my-bookings.html'">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--c-success)" stroke-width="2" style="margin-bottom:12px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                            <h5>My Bookings</h5>
                            <p class="text-muted mb-0">View your rental history</p>
                        </div>
                    </div>`;
            } else {
                content.innerHTML = `
                    <div class="mb-4">
                        <h4 class="heading-lg">Welcome, ${user.name}</h4>
                        <p class="text-muted">Fleet management overview</p>
                    </div>
                    <div class="grid-4 mb-4">
                        <div class="stat-card">
                            <div class="stat-icon blue"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
                            <div class="stat-value">${stats.totalVehicles || 0}</div>
                            <div class="stat-label">Total Vehicles</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon green"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
                            <div class="stat-value">${stats.availableVehicles || 0}</div>
                            <div class="stat-label">Available</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon orange"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
                            <div class="stat-value">${stats.bookedVehicles || 0}</div>
                            <div class="stat-label">Booked</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon purple"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
                            <div class="stat-value">${stats.totalBranches || 0}</div>
                            <div class="stat-label">Branches</div>
                        </div>
                    </div>
                    <div class="grid-3">
                        <div class="stat-card text-center" style="cursor:pointer" onclick="location.href='manage-vehicles.html'">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--c-accent)" stroke-width="2" style="margin-bottom:12px"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C1.4 11.3 1 12.2 1 13v3c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
                            <h5>Manage Vehicles</h5>
                            <p class="text-muted mb-0">Add, edit, remove vehicles</p>
                        </div>
                        <div class="stat-card text-center" style="cursor:pointer" onclick="location.href='pickup.html'">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--c-warning)" stroke-width="2" style="margin-bottom:12px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                            <h5>Process Pickups</h5>
                            <p class="text-muted mb-0">Record vehicle handovers</p>
                        </div>
                        <div class="stat-card text-center" style="cursor:pointer" onclick="location.href='reports.html'">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--c-success)" stroke-width="2" style="margin-bottom:12px"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                            <h5>View Reports</h5>
                            <p class="text-muted mb-0">Utilization & revenue</p>
                        </div>
                    </div>`;
            }

            document.querySelectorAll(".stat-value[data-target]").forEach(el => {
                const target = parseInt(el.dataset.target);
                if (!isNaN(target)) animateCounter(el, target);
            });
        }

        loadDashboard();
    </script>
</body>
</html>
