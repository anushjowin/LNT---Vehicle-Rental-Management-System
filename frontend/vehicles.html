<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Vehicles — DRIVE.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="appLayout" class="app-layout"></div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script>
        if (!requireAuth()) throw new Error("Not authenticated");
        buildLayout("vehicles");
        document.getElementById("pageTitle").textContent = "Search Vehicles";

        const content = document.getElementById("pageContent");
        let branches = [];

        async function init() {
            try {
                const res = await apiFetch("/branches");
                branches = res.data || [];
            } catch(e) {}

            content.innerHTML = `
                <div class="search-panel">
                    <h5><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> Find Available Vehicles</h5>
                    <form id="searchForm">
                        <div class="grid-4" style="grid-template-columns: repeat(5, 1fr)">
                            <div class="form-group">
                                <label class="form-label">Start Date</label>
                                <input type="date" class="form-control" id="startDate" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">End Date</label>
                                <input type="date" class="form-control" id="endDate" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Branch</label>
                                <select class="form-control" id="branchFilter">
                                    <option value="">All Branches</option>
                                    ${branches.map(b => `<option value="${b._id}">${b.name}</option>`).join("")}
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Type</label>
                                <select class="form-control" id="typeFilter">
                                    <option value="">All Types</option>
                                    <option value="car">Car</option>
                                    <option value="bike">Bike</option>
                                </select>
                            </div>
                            <div class="form-group" style="display:flex;align-items:flex-end">
                                <button type="submit" class="btn btn-primary w-100">Search</button>
                            </div>
                        </div>
                    </form>
                </div>
                <div id="alertBox"></div>
                <div id="results"></div>`;

            document.getElementById("startDate").min = new Date().toISOString().split("T")[0];
            document.getElementById("searchForm").addEventListener("submit", searchVehicles);
        }

        async function searchVehicles(e) {
            e.preventDefault();
            const resultsDiv = document.getElementById("results");
            const alertBox = document.getElementById("alertBox");

            const startDate = document.getElementById("startDate").value;
            const endDate = document.getElementById("endDate").value;
            const branchId = document.getElementById("branchFilter").value;
            const type = document.getElementById("typeFilter").value;

            let query = `?startDate=${startDate}&endDate=${endDate}`;
            if (branchId) query += `&branchId=${branchId}`;
            if (type) query += `&type=${type}`;

            try {
                const res = await apiFetch(`/vehicles/search${query}`);
                const vehicles = res.data || [];

                if (vehicles.length === 0) {
                    resultsDiv.innerHTML = `
                        <div class="empty-state">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--c-text-dim)" stroke-width="1.5"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C1.4 11.3 1 12.2 1 13v3c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
                            <h5>No vehicles available</h5>
                            <p>Try different dates or filters</p>
                        </div>`;
                    return;
                }

                resultsDiv.innerHTML = `
                    <div class="d-flex justify-between align-center mb-3">
                        <h5>Available Vehicles (${vehicles.length})</h5>
                    </div>
                    <div class="vehicle-grid">
                        ${vehicles.map(v => `
                            <div class="vehicle-card">
                                <div class="vehicle-img">
                                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--c-text-dim)" stroke-width="1.5"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C1.4 11.3 1 12.2 1 13v3c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
                                </div>
                                <div class="card-body">
                                    <h6>${v.brand} ${v.model}</h6>
                                    <div class="vehicle-meta">
                                        <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> ${v.year}</span>
                                        <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg> ${v.type}</span>
                                        <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 22V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v17"/><path d="M13 10h4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-4"/><line x1="7" y1="14" x2="7" y2="14.01"/></svg> ${v.fuelType || 'Petrol'}</span>
                                    </div>
                                    <p class="text-muted small mb-2">${v.branchId?.name || 'N/A'} &middot; ${v.branchId?.city || ''}</p>
                                    <div class="d-flex justify-between align-center">
                                        <div class="vehicle-rate">${formatCurrency(v.perDayRate)} <span>/day</span></div>
                                        <button class="btn btn-primary btn-sm" onclick="bookVehicle('${v._id}', '${startDate}', '${endDate}')">Book Now</button>
                                    </div>
                                </div>
                            </div>
                        `).join("")}
                    </div>`;
            } catch (err) {
                showAlert(alertBox, err.message || "Search failed");
                resultsDiv.innerHTML = "";
            }
        }

        function bookVehicle(vehicleId, startDate, endDate) {
            window.location.href = `booking.html?vehicleId=${vehicleId}&start=${startDate}&end=${endDate}`;
        }

        init();
    </script>
</body>
</html>
