<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — DRIVE.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="appLayout" class="app-layout"></div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script>
        if (!requireAuth()) throw new Error("Not authenticated");
        buildLayout("profile");
        document.getElementById("pageTitle").textContent = "My Profile";

        const content = document.getElementById("pageContent");
        const user = getUser();

        content.innerHTML = `
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="form-card">
                        <div class="text-center mb-4">
                            <div style="width:80px;height:80px;border-radius:50%;background:var(--c-accent);color:var(--c-black);display:inline-flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;font-family:var(--font-heading)">
                                ${user.name.charAt(0).toUpperCase()}
                            </div>
                            <h4 class="mt-3 mb-1">${user.name}</h4>
                            <span class="role-badge ${user.role}" style="font-size:0.85rem;">${user.role.toUpperCase()}</span>
                        </div>

                        <div style="display:grid;gap:16px;margin-bottom:32px">
                            <div class="form-group" style="margin-bottom:0">
                                <label class="form-label">Full Name</label>
                                <div class="form-control" style="background:var(--c-surface-raised);color:var(--c-text-muted);border:1px solid var(--c-border)">${user.name}</div>
                            </div>
                            <div class="form-group" style="margin-bottom:0">
                                <label class="form-label">Email Address</label>
                                <div class="form-control" style="background:var(--c-surface-raised);color:var(--c-text-muted);border:1px solid var(--c-border)">${user.email}</div>
                            </div>
                            <div class="grid-2">
                                <div class="form-group" style="margin-bottom:0">
                                    <label class="form-label">Role</label>
                                    <div class="form-control" style="background:var(--c-surface-raised);color:var(--c-text-muted);border:1px solid var(--c-border);text-transform:capitalize">${user.role}</div>
                                </div>
                                <div class="form-group" style="margin-bottom:0">
                                    <label class="form-label">Branch ID</label>
                                    <div class="form-control" style="background:var(--c-surface-raised);color:var(--c-text-muted);border:1px solid var(--c-border)">${user.branchId || 'N/A'}</div>
                                </div>
                            </div>
                            <div class="form-group" style="margin-bottom:0">
                                <label class="form-label">User ID</label>
                                <div class="form-control" style="background:var(--c-surface-raised);color:var(--c-text-muted);border:1px solid var(--c-border)"><code>${user._id}</code></div>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <a href="dashboard.html" class="btn btn-outline flex-fill"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px"><polyline points="15 18 9 12 15 6"/></svg> Back to Dashboard</a>
                            <button class="btn btn-danger flex-fill" onclick="handleLogout()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout</button>
                        </div>
                    </div>
                </div>
            </div>`;
    </script>
</body>
</html>
