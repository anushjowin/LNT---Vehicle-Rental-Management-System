<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Branches — DRIVE.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="appLayout" class="app-layout"></div>

    <div class="modal-overlay" id="branchModal">
        <div class="modal">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add Branch</h5>
                <button class="modal-close" onclick="hideModal()">&times;</button>
            </div>
            <form id="branchForm">
                <input type="hidden" id="b_id">
                <div class="form-group">
                    <label class="form-label">Branch Name</label>
                    <input type="text" class="form-control" id="b_name" required placeholder="e.g., Downtown Branch">
                </div>
                <div class="form-group">
                    <label class="form-label">City</label>
                    <input type="text" class="form-control" id="b_city" required placeholder="e.g., Mumbai">
                </div>
                <div class="form-group">
                    <label class="form-label">Address</label>
                    <input type="text" class="form-control" id="b_address" placeholder="123 Main St">
                </div>
                <div class="form-group">
                    <label class="form-label">Phone</label>
                    <input type="text" class="form-control" id="b_phone" placeholder="+91-9876543210">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="hideModal()">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveBranch()">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script>
        if (!requireAuth()) throw new Error("Not authenticated");
        if (!requireRole("admin")) throw new Error("Not authorized");
        buildLayout("branches");
        document.getElementById("pageTitle").textContent = "Manage Branches";

        const content = document.getElementById("pageContent");
        let branches = [];

        function showModal() { document.getElementById("branchModal").classList.add("show"); }
        function hideModal() { document.getElementById("branchModal").classList.remove("show"); }

        async function loadBranches() {
            try {
                const res = await apiFetch("/branches");
                branches = res.data || [];
                renderTable();
            } catch (err) {
                content.innerHTML = `<div class="alert" style="background:rgba(255,68,68,0.12);color:#ff4444;padding:16px;border-radius:12px">Failed to load branches</div>`;
            }
        }

        function renderTable() {
            content.innerHTML = `
                <div class="data-table">
                    <div class="table-header">
                        <h5>All Branches (${branches.length})</h5>
                        <button class="btn btn-primary btn-sm" onclick="openModal()">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            Add Branch
                        </button>
                    </div>
                    <div id="alertBox" style="padding:16px 20px 0"></div>
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>City</th>
                                <th>Address</th>
                                <th>Phone</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${branches.map(b => `
                                <tr>
                                    <td><strong>${b.name}</strong></td>
                                    <td>${b.city}</td>
                                    <td>${b.address || '-'}</td>
                                    <td>${b.phone || '-'}</td>
                                    <td>
                                        <button class="btn btn-outline btn-sm" style="margin-right:6px" onclick="editBranch('${b._id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>
                                        <button class="btn btn-danger btn-sm" onclick="deleteBranch('${b._id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
                                    </td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                </div>`;
        }

        function openModal(branch = null) {
            if (branch) {
                document.getElementById("modalTitle").textContent = "Edit Branch";
                document.getElementById("b_id").value = branch._id;
                document.getElementById("b_name").value = branch.name;
                document.getElementById("b_city").value = branch.city;
                document.getElementById("b_address").value = branch.address || "";
                document.getElementById("b_phone").value = branch.phone || "";
            } else {
                document.getElementById("modalTitle").textContent = "Add Branch";
                document.getElementById("branchForm").reset();
                document.getElementById("b_id").value = "";
            }
            showModal();
        }

        function editBranch(id) {
            const b = branches.find(b => b._id === id);
            if (b) openModal(b);
        }

        async function saveBranch() {
            const alertBox = document.getElementById("alertBox");
            const id = document.getElementById("b_id").value;
            const body = {
                name: document.getElementById("b_name").value,
                city: document.getElementById("b_city").value,
                address: document.getElementById("b_address").value,
                phone: document.getElementById("b_phone").value
            };

            try {
                if (id) {
                    await apiFetch(`/branches/${id}`, { method: "PUT", body });
                } else {
                    await apiFetch("/branches", { method: "POST", body });
                }
                hideModal();
                showAlert(alertBox, id ? "Branch updated!" : "Branch created!", "success");
                loadBranches();
            } catch (err) {
                showAlert(alertBox, err.message || "Save failed");
            }
        }

        async function deleteBranch(id) {
            if (!confirm("Delete this branch?")) return;
            const alertBox = document.getElementById("alertBox");
            try {
                await apiFetch(`/branches/${id}`, { method: "DELETE" });
                showAlert(alertBox, "Branch deleted!", "success");
                loadBranches();
            } catch (err) {
                showAlert(alertBox, err.message || "Delete failed");
            }
        }

        loadBranches();
    </script>
</body>
</html>
