<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Return — DRIVE.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="appLayout" class="app-layout"></div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script>
        if (!requireAuth()) throw new Error("Not authenticated");
        if (!requireRole("staff", "admin")) throw new Error("Not authorized");
        buildLayout("return");
        document.getElementById("pageTitle").textContent = "Process Return";

        const content = document.getElementById("pageContent");
        const params = new URLSearchParams(window.location.search);
        const bookingId = params.get("bookingId");

        function render() {
            content.innerHTML = `
                <div class="row justify-content-center">
                    <div class="col-lg-6">
                        <div class="form-card">
                            <h5 class="heading-lg mb-2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg> Return Inspection</h5>
                            <p class="text-muted mb-4">Record vehicle condition at return & compute charges</p>

                            <div id="alertBox"></div>

                            <form id="returnForm">
                                <div class="form-group">
                                    <label class="form-label">Booking ID</label>
                                    <input type="text" class="form-control" id="bookingInput" value="${bookingId || ''}" ${bookingId ? 'readonly style="opacity:0.6;cursor:not-allowed"' : ''} required placeholder="Enter booking ID">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Odometer Reading (km)</label>
                                    <input type="number" class="form-control" id="odometer" required min="0" placeholder="e.g., 15500">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Fuel Level (%)</label>
                                    <input type="number" class="form-control" id="fuelLevel" required min="0" max="100" placeholder="0-100">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Damage Notes (optional)</label>
                                    <textarea class="form-control" id="damageNotes" rows="3" placeholder="Any damage observed..."></textarea>
                                </div>

                                <div class="mt-3 mb-3" style="background:var(--c-info-dim);color:var(--c-info);padding:12px 16px;border-radius:10px;font-size:0.85rem;display:flex;gap:8px;align-items:flex-start">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:2px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                                    <span><strong>Charge Logic:</strong> If fuel level is lower than pickup, a charge of &#8377;10 per % difference applies. If damage notes are provided, a flat &#8377;500 damage charge applies.</span>
                                </div>

                                <button type="submit" class="btn btn-success w-100" id="submitBtn">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                                    Record Return
                                </button>
                            </form>
                        </div>
                    </div>
                </div>`;

            document.getElementById("returnForm").addEventListener("submit", submitReturn);
        }

        async function submitReturn(e) {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            const alertBox = document.getElementById("alertBox");
            const bid = document.getElementById("bookingInput").value.trim();

            if (!bid) { showAlert(alertBox, "Please enter a booking ID"); return; }

            btn.disabled = true;
            btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 0.8s linear infinite"><circle cx="12" cy="12" r="10"/></svg> Processing...';

            try {
                const res = await apiFetch(`/bookings/${bid}/return`, {
                    method: "POST",
                    body: {
                        odometer: parseFloat(document.getElementById("odometer").value),
                        fuelLevel: parseFloat(document.getElementById("fuelLevel").value),
                        damageNotes: document.getElementById("damageNotes").value
                    }
                });
                showAlert(alertBox, `Return recorded! Damage charge: \u20B9${res.data.damageCharge || 0}. Total: \u20B9${res.data.totalAmount}`, "success");
                setTimeout(() => { window.location.href = `booking-detail.html?id=${bid}`; }, 2000);
            } catch (err) {
                showAlert(alertBox, err.message || "Return failed");
                btn.disabled = false;
                btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg> Record Return';
            }
        }

        render();
    </script>
</body>
</html>
